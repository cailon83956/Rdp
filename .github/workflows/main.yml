name: Ubuntu SSH via Tailscale

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install SSH
        run: |
          sudo apt update
          sudo apt install -y openssh-server
          sudo systemctl enable ssh
          sudo systemctl start ssh

      - name: Create SSH user
        run: |
          PASSWORD="pass$(shuf -i1000-9999 -n1)"
          sudo useradd -m -s /bin/bash sshuser
          echo "sshuser:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo sshuser
          echo "SSH_USER=sshuser" >> $GITHUB_ENV
          echo "SSH_PASS=$PASSWORD" >> $GITHUB_ENV

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl enable --now tailscaled

      - name: Connect to Tailscale
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-ubuntu-$GITHUB_RUN_ID

          tailscale ip -4 | head -n1 | sed 's/^/TS_IP=/' >> $GITHUB_ENV

      - name: Show SSH info
        run: |
          echo "=============================="
          echo "SSH IP   : $TS_IP"
          echo "User     : $SSH_USER"
          echo "Password : $SSH_PASS"
          echo "=============================="

      - name: Keep Alive
        run: |
          while true; do sleep 300; done
