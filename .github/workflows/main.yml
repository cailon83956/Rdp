name: Create Ubuntu droplet with Tailscale
on:
  workflow_dispatch:

jobs:
  create-droplet:
    runs-on: ubuntu-latest

    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}

      DROPLET_NAME: github-tailscale-1
      REGION: sgp1
      SIZE: s-1vcpu-1gb
      IMAGE: ubuntu-22-04-x64

    steps:
      # ✅ CÀI DOCTL BẰNG OFFICIAL ACTION
      - name: Install doctl (DigitalOcean official action)
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Build cloud-init user-data
        run: |
          cat > user-data.yaml <<YML
          #cloud-config
          users:
            - name: ubuntu
              sudo: ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              ssh_authorized_keys:
                - ${SSH_PUBLIC_KEY}

          runcmd:
            - apt-get update
            - apt-get install -y curl gnupg apt-transport-https openssh-server
            - curl -fsSL https://tailscale.com/install.sh | sh
            - systemctl enable --now tailscaled
            - tailscale up --authkey ${TAILSCALE_AUTHKEY} --hostname ${DROPLET_NAME}
            - systemctl enable --now ssh
          YML

      - name: Create droplet
        run: |
          doctl compute droplet create ${DROPLET_NAME} \
            --region ${REGION} \
            --size ${SIZE} \
            --image ${IMAGE} \
            --user-data-file user-data.yaml \
            --tag-names tailscale,github-action \
            --wait \
            --format ID,Name,PublicIPv4

      - name: Show droplet list
        run: |
          doctl compute droplet list --tag-name tailscale --format ID,Name,PublicIPv4,Status
