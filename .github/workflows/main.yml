name: Debug with SSH (tmate + Tailscale via Auth Key)

on:
  workflow_dispatch:  # Chạy thủ công từ tab Actions

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Kết nối Tailscale dùng auth key (TAILSCALE_AUTH_KEY)
      - name: Connect to Tailscale network (using Auth Key)
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}   # Secret tên TAILSCALE_AUTH_KEY
          tags: tag:ci-github                          # Thay bằng tag bạn gắn cho key
          # Optional: ping máy trong tailnet để chờ kết nối ổn định (thay IP/hostname)
          ping: 100.x.x.x, ten-may.tailnet.ts.net
          # statedir: /tmp/tailscale-state            # Uncomment nếu dùng Tailnet Lock

      # Kiểm tra Tailscale đã up và kết nối OK (optional, debug)
      - name: Check Tailscale status
        run: |
          tailscale status
          tailscale ip -4
          tailscale ping 100.x.x.x   # ping máy bạn để test kết nối

      # Setup tmate session để SSH debug trực tiếp
      - name: Setup tmate session (SSH debug)
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true   # Chỉ bạn (người trigger) mới connect được
          detached: false               # Giữ job chờ bạn connect và debug
          # timeout-minutes: 0          # Uncomment nếu muốn session kéo dài (max 6h job)

      # Optional: step chạy sau khi bạn debug xong (nếu cần)
      # - name: Example after debug
      #   run: echo "Debug xong, runner sẽ disconnect Tailscale tự động"
