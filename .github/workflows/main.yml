name: Ubuntu-Attack-Server

on:
  workflow_dispatch:

jobs:
  ubuntu-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Cai dat vu khi
        run: |
          sudo apt-get update
          # Đã loại bỏ tailscale khỏi đây để tránh lỗi "Unable to locate package"
          sudo apt-get install -y hping3 nmap ffmpeg
          echo "Súng ống hping3 và nmap đã nạp đạn xong!"

      - name: Ket noi Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Thiet lap mat khau SSH
        run: |
          # Đặt mật khẩu là 123456 để bro đăng nhập từ Termux cho lẹ
          echo "runner:123456" | sudo chpasswd
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh

      - name: Duy tri phao dai (Maintain Connection)
        run: |
          # Lấy IP Tailscale tự động để bro nhìn cho dễ
          TS_IP=$(tailscale ip -4)
          echo "=== THÔNG TIN KẾT NỐI UBUNTU ==="
          echo "Địa chỉ IP: $TS_IP"
          echo "Tài khoản: runner"
          echo "Mật khẩu: 123456"
          echo "================================"
          
          while true; do
            echo "[$(date)] Ubuntu đang online - Đang đợi bro nã đạn..."
            sleep 300
          done
          
