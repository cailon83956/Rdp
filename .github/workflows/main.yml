name: Create Ubuntu droplet with Tailscale
on:
  workflow_dispatch:

jobs:
  create-droplet:
    runs-on: ubuntu-latest

    env:
      DO_TOKEN: ${{ secrets.DO_TOKEN }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}

      DROPLET_NAME: github-tailscale-1
      REGION: sgp1
      SIZE: s-1vcpu-1gb
      IMAGE: ubuntu-22-04-x64

    steps:
      - name: Install doctl (official apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://repos.digitalocean.com/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/digitalocean.gpg
          echo "deb [signed-by=/etc/apt/keyrings/digitalocean.gpg] https://repos.digitalocean.com/apt main main" | sudo tee /etc/apt/sources.list.d/digitalocean.list
          sudo apt-get update
          sudo apt-get install -y doctl
          doctl version

      - name: Build cloud-init user-data
        run: |
          cat > user-data.yaml <<YML
          #cloud-config
          users:
            - name: ubuntu
              sudo: ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              ssh_authorized_keys:
                - ${SSH_PUBLIC_KEY}

          runcmd:
            - apt-get update
            - apt-get install -y curl gnupg apt-transport-https openssh-server
            - curl -fsSL https://tailscale.com/install.sh | sh
            - systemctl enable --now tailscaled
            - tailscale up --authkey ${TAILSCALE_AUTHKEY} --hostname ${DROPLET_NAME}
            - systemctl enable --now ssh
          YML

      - name: Create droplet
        run: |
          export DIGITALOCEAN_ACCESS_TOKEN="${DO_TOKEN}"
          doctl auth init -t "$DIGITALOCEAN_ACCESS_TOKEN"

          doctl compute droplet create ${DROPLET_NAME} \
            --region ${REGION} \
            --size ${SIZE} \
            --image ${IMAGE} \
            --user-data-file user-data.yaml \
            --tag-names tailscale,github-action \
            --wait \
            --format ID,Name,PublicIPv4

      - name: Show droplet list
        run: |
          doctl compute droplet list --tag-name tailscale --format ID,Name,PublicIPv4,Status
